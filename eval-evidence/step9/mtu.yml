- hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.add_host: {name: DC-Service-Leaf, groups: dc_fabric_switches, ansible_host: 198.18.128.13}
- hosts: DC-Service-Leaf
  gather_facts: false
  tasks:
    - cisco.nxos.nxos_command:
        commands: ["show interface Ethernet1/8.4 | include MTU", "show interface Ethernet1/8.2 | include MTU", "show ip bgp summary vrf main | include 192.168"]
      register: o
    - ansible.builtin.debug: {msg: "{{ o.stdout }}"}
